# Every Foundation-0 repository: its custom properties and its topics, under the labelling standard
# (LABELS-STANDARD.md). `sync.py repos plan` shows what differs on GitHub; `repos apply` sets it. Owners only.
# Stages are the profile README's tiers; a research repository without a stage has not been assessed yet.

version = 1
org = "Foundation-0"
required_topics = ["foundation-0"]

[properties.kind]
type = "multi_select"
values = ["org-home", "core", "site", "hub", "research", "workspace", "anthology", "ops", "demo", "placeholder"]
description = "What the repository is"

[properties.domain]
type = "multi_select"
values = ["mathematics", "physics", "astronomy", "earth-science", "engineering", "medicine", "musicology", "science-of-science", "formal-verification", "ai-progress"]
description = "What it is about"

[properties.stage]
type = "single_select"
values = ["seed", "active", "published"]
description = "Its tier under the Repository Standard"

[properties.board]
type = "single_select"
values = ["main", "internal", "project", "none"]
description = "Its discussion board under the forum standard"

[properties.owner]
type = "string"
description = "The person or team who answers for it"

[[repos]]
name = ".github"
kind = ["org-home"]
board = "main"

